name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # conftest.py also sets this; FINUFFT reductions are only reproducible
      # single-threaded (see tests/conftest.py).
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Versions
        run: python -m pip list | grep -iE "^(jax|jaxlib|jax-finufft|finufft|healjax|healpy|hera|fftvis|matvis|pyuvdata|numpy|scipy) "

      - name: Unit tests
        run: python -m pytest -m "not convergence" -q

      - name: Convergence baselines
        run: python -m pytest -m convergence -q
